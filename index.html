<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Una hermosa tarjeta interactiva para celebrar el Día del Amor y la Amistad.">
    <meta name="author" content="Diego">
    <title>Feliz Dia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            width: 400px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: scale(1.03);
        }
        .container::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(255, 0, 150, 0.2);
            border-radius: 50%;
            top: -50px;
            right: -50px;
        }
        .container::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(255, 50, 100, 0.2);
            border-radius: 50%;
            bottom: -40px;
            left: -40px;
        }
        .heart {
            color: red;
            font-size: 60px;
            animation: heartbeat 1.5s infinite;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .heart:hover {
            transform: scale(1.3);
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .message {
            font-size: 20px;
            color: #d6336c;
            font-weight: bold;
            margin-top: 15px;
            transition: opacity 0.3s ease-in-out;
        }
        h1 {
            font-size: 24px;
            color: #ff4d6d;
        }
        .footer {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>
    <script>
        function changeMessage() {
            let message = document.querySelector('.message');
            message.style.opacity = 0;
            setTimeout(() => {
                message.textContent = "¡Te deseo un día maravilloso lleno de amor y amistad! 💖";
                message.style.opacity = 1;
            }, 300);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>💖 ¡Feliz Día del Amor y la Amistad! 💖</h1>
        <p class="heart" onclick="changeMessage()">❤️</p>
        <p class="message">Que este día esté lleno de amor, amistad y momentos inolvidables. 💕</p>
        <p class="footer">Hecho con amor💕 para ti</p>
        <p class="message">ATT: Diego</p>
    </div>
</body>
</html>
